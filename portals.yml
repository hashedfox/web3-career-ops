# Portal Scanner Configuration — Alexander S. Sly
# Web3 Growth / BD / GTM / Partnerships roles
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Title filter --
title_filter:
  positive:
    # -- Tier 1: Bullseye --
    - "Head of Growth"
    - "Growth Lead"
    - "Growth Manager"
    - "GTM"
    - "Go-to-Market"
    - "Head of Business Development"
    - "Business Development Lead"
    - "BD Lead"
    - "VP Partnerships"
    - "Director of Partnerships"
    - "Head of Partnerships"
    - "Partnerships Lead"
    # -- Tier 2: Strong Fit --
    - "Head of Strategy"
    - "Strategy & Operations"
    - "Chief of Staff"
    - "Director of Revenue"
    - "Revenue Lead"
    - "Head of Ecosystem"
    - "Ecosystem Development"
    - "Ecosystem Lead"
    - "Head of Marketing"
    - "Marketing Lead"
    # -- Adjacent / catch-all --
    - "Business Development"
    - "Partnerships"
    - "Growth"
    - "DevRel"
    - "Developer Relations"
    - "Community Lead"
    - "Head of Community"
    - "Sales Lead"
    - "Head of Sales"
  negative:
    - "Junior"
    - "Intern"
    - "Internship"
    - "Entry Level"
    - "Software Engineer"
    - "Frontend Engineer"
    - "Backend Engineer"
    - "Smart Contract"
    - "Solidity Developer"
    - "Rust Engineer"
    - "QA Engineer"
    - "Security Engineer"
    - "DevOps"
    - "SRE"
    - "Data Scientist"
    - "Machine Learning Engineer"
    - "UI/UX Designer"
    - "Graphic Designer"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Director"
    - "VP"

# -- Search queries --
search_queries:

  # -- Web3 Job Boards (direct portal scan) --
  - name: CryptoJobsList — Growth & BD
    query: 'site:cryptojobslist.com "Head of Growth" OR "Growth Lead" OR "Business Development" OR "GTM" OR "Partnerships" OR "Head of Marketing" OR "Ecosystem"'
    portal_url: https://cryptojobslist.com/
    enabled: true

  - name: Web3.career — Remote Growth & BD
    query: 'site:web3.career "Head of Growth" OR "Growth Lead" OR "BD" OR "Partnerships" OR "GTM" OR "Ecosystem"'
    portal_url: https://web3.career/remote-jobs
    enabled: true

  - name: CryptocurrencyJobs — Growth & BD
    query: 'site:cryptocurrencyjobs.co "Head of Growth" OR "Growth Lead" OR "Business Development" OR "GTM" OR "Partnerships" OR "Head of Marketing" OR "Ecosystem"'
    portal_url: https://cryptocurrencyjobs.co/
    enabled: true

  - name: Crypto.jobs — Growth & BD
    query: 'site:crypto.jobs "Head of Growth" OR "Growth Lead" OR "Business Development" OR "GTM" OR "Partnerships"'
    enabled: true

  - name: Remote3 — Growth & BD
    query: 'site:remote3.co "Growth" OR "Business Development" OR "Partnerships" OR "Ecosystem"'
    enabled: true

  # -- Greenhouse (Web3 companies) --
  - name: Greenhouse — Web3 Growth
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Head of Growth" OR "Growth Lead" OR "GTM" crypto OR web3 OR blockchain OR DeFi OR DePIN'
    enabled: true

  - name: Greenhouse — Web3 BD
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Business Development" OR "Partnerships" OR "Ecosystem" crypto OR web3 OR blockchain OR protocol'
    enabled: true

  - name: Greenhouse — Web3 Strategy
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Chief of Staff" OR "Strategy" OR "Revenue" crypto OR web3 OR blockchain'
    enabled: true

  # -- Ashby (Web3 companies) --
  - name: Ashby — Web3 Growth & BD
    query: 'site:jobs.ashbyhq.com "Growth" OR "Business Development" OR "Partnerships" OR "Ecosystem" crypto OR web3 OR blockchain OR DeFi'
    enabled: true

  # -- Lever (Web3 companies) --
  - name: Lever — Web3 Growth & BD
    query: 'site:jobs.lever.co "Growth" OR "Business Development" OR "Partnerships" crypto OR web3 OR blockchain'
    enabled: true

  # -- Wellfound (startups) --
  - name: Wellfound — Web3 Growth
    query: 'site:wellfound.com "Head of Growth" OR "Growth Lead" OR "BD" web3 OR crypto OR blockchain remote'
    enabled: true

  # -- LinkedIn (broad discovery) --
  - name: LinkedIn — Web3 Growth Head
    query: 'site:linkedin.com/jobs "Head of Growth" web3 OR crypto OR blockchain OR DeFi remote'
    enabled: true

  - name: LinkedIn — Web3 BD Head
    query: 'site:linkedin.com/jobs "Head of Business Development" OR "VP Partnerships" web3 OR crypto OR protocol remote'
    enabled: true

  # -- DePIN specific --
  - name: DePIN Growth & BD
    query: '"DePIN" "Head of Growth" OR "Growth Lead" OR "Business Development" OR "Partnerships" remote'
    enabled: true

  # -- Protocol / Foundation specific --
  - name: Protocol Foundations — Growth
    query: '"foundation" OR "protocol" "Head of Growth" OR "Ecosystem Lead" OR "BD Lead" web3 OR crypto remote'
    enabled: true

